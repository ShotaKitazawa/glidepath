[tools]
go = "1.26.1"
air = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"

[env]
# A plain file path — SQLite needs no server/container, so `mise run dev`
# just migrates this file in place before starting Air. Only used by
# `mise run dev`/`ci-test`; production sets DATABASE_URL itself.
DATABASE_URL = "{{config_root}}/glidepath-dev.db"
# Isolated scratch file for `mise run test-integration`, reset (deleted +
# re-migrated) before every run so it never touches dev data.
TEST_DATABASE_URL = "{{config_root}}/glidepath-test.db"

[tasks.dev]
run = """
  mise run db-migrate &&
  air
"""

[tasks.db-reset]
run = """
  rm -f "$DATABASE_URL" &&
  mise run db-migrate
"""

[tasks.db-migrate]
run = "go run github.com/pressly/goose/v3/cmd/goose -dir internal/database/migrations sqlite3 \"$DATABASE_URL\" up"

[tasks.test-integration]
run = """
  rm -f "$TEST_DATABASE_URL" &&
  go run github.com/pressly/goose/v3/cmd/goose -dir internal/database/migrations sqlite3 "$TEST_DATABASE_URL" up &&
  DATABASE_URL="$TEST_DATABASE_URL" go test -tags=integration ./...
"""

[tasks.generate]
run = "go generate ./internal/database/"

[tasks.format]
run = """
  gofmt -l -w .
  goimports -w .
"""

[tasks.test]
run = "go test ./..."

[tasks.pre-merge]
run = """
  mise run generate &&
  mise run format &&
  mise run ci
"""

[tasks.ci]
run = """
  mise run ci-install &&
  mise run ci-fmt &&
  mise run ci-lint &&
  mise run ci-test &&
  mise run ci-build
"""

[tasks.ci-install]
run = "go mod download"

[tasks.ci-fmt]
run = "test -z \"$(gofmt -l .)\""

[tasks.ci-lint]
run = "go vet ./..."

[tasks.ci-test]
run = "go test ./..."

[tasks.ci-build]
run = "go build ./..."
