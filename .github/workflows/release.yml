name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Set image tag in manifests
        working-directory: manifests
        run: |
          # ghcr.io requires a lowercase repository path (OCI spec); GitHub's
          # own repository name preserves case, so lowercase it explicitly —
          # docker/metadata-action (build.yml) does this automatically, but
          # kustomize's raw string substitution here does not.
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          kustomize edit set image "ghcr.io/${repo}=ghcr.io/${repo}:release-${{ github.ref_name }}"

      - name: Build install.yaml
        run: kustomize build ./manifests > install.yaml

      - uses: softprops/action-gh-release@v2
        with:
          files: install.yaml
          generate_release_notes: true
