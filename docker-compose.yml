# Local development dependencies (Postgres only). Run the app itself on the
# host via `mise run dev`, which uses Air for hot-reload.
#
# db-test is a second, isolated instance for integration tests
# (mise run test-integration) — its own container/volume/port, so test
# runs never touch data in `db` that's being used for manual verification.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: glidepath
      POSTGRES_PASSWORD: glidepath
      POSTGRES_DB: glidepath
      # Apple's `container` CLI formats named volumes with a filesystem that
      # pre-populates a lost+found directory, which makes initdb refuse to
      # use the mount root directly. A subdirectory works on both engines.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: glidepath
      POSTGRES_PASSWORD: glidepath
      POSTGRES_DB: glidepath
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - db-test-data:/var/lib/postgresql/data

volumes:
  db-data:
  db-test-data:
