apiVersion: apps/v1
kind: Deployment
metadata:
  name: glidepath
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glidepath
  template:
    metadata:
      labels:
        app: glidepath
    spec:
      containers:
        - name: glidepath
          image: ghcr.io/shotakitazawa/glidepath
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: glidepath-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
      volumes:
        - name: data
          # SQLite data file (DATABASE_URL, see secret.yaml.example) — a
          # deployer that needs it to survive pod restarts replaces this
          # with a PersistentVolumeClaim (see the sibling app kondate's
          # home-monorepo overlay for that pattern).
          emptyDir: {}
